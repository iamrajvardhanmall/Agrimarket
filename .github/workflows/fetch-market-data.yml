name: Auto Fetch Mandi Market Data (Every 12 Hours)

on:
  schedule:
    # Runs at 06:17 and 18:17 UTC every day (every 12 hours)
    # Off-beat minute avoids GitHub's peak-load queue congestion at :00 marks
    # 06:17 UTC = 11:47 IST  |  18:17 UTC = 23:47 IST
    - cron: '17 6,18 * * *'
  workflow_dispatch:   # Manual trigger from GitHub Actions tab anytime
    inputs:
      force_commit:
        description: 'Force a keepalive commit even if no new data (yes/no)'
        required: false
        default: 'no'

concurrency:
  group: fetch-market-data
  cancel-in-progress: false

jobs:
  fetch-and-push:
    name: Fetch Mandi Data & Push to GitHub
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python setup with pip cache ───────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. Install required dependencies ─────────────────────────────────
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install python-dotenv requests --quiet

      # ── 4. Validate MARKET_DATA_API_KEY is set ───────────────────────────
      - name: Check API Key
        id: check_key
        run: |
          if [ -z "${{ secrets.MARKET_DATA_API_KEY }}" ]; then
            echo "::warning::MARKET_DATA_API_KEY secret is not set in GitHub repository secrets."
            echo "key_set=false" >> "$GITHUB_OUTPUT"
          else
            echo "key_set=true" >> "$GITHUB_OUTPUT"
            echo "API key is configured."
          fi

      # ── 5. Run live data fetch ────────────────────────────────────────────
      - name: Run Mandi Fetch Script
        id: fetch
        env:
          MARKET_DATA_API_KEY: ${{ secrets.MARKET_DATA_API_KEY }}
          CI: 'true'
        run: |
          echo "Starting data fetch at $(date -u '+%Y-%m-%d %H:%M:%S UTC') ..."
          if python data_engine/fetch_daily_market_data.py --max-records 5000; then
            echo "fetch_ok=true" >> "$GITHUB_OUTPUT"
            echo "Live data fetched successfully."
          else
            echo "fetch_ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=data.gov.in Geo-Block::data.gov.in blocks foreign cloud runner IPs (Azure/GitHub). Dataset unchanged. Use update_today_mandi_data.bat locally to push live data."
          fi

      # ── 6. Commit Dataset.csv if changed, OR write keepalive stamp ────────
      #    Guarantees at least one commit per run so GitHub never disables
      #    the cron schedule due to 60-day repo inactivity.
      - name: Commit Dataset or Write Keepalive Stamp
        env:
          FORCE_COMMIT: ${{ github.event.inputs.force_commit || 'no' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data_engine/Dataset.csv

          if git diff --staged --quiet; then
            echo "No new market data (geo-blocked or unchanged)."

            # Write keepalive stamp so GitHub never disables the schedule
            mkdir -p .github/keepalive
            echo "Last scheduled run : $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .github/keepalive/last_run.txt
            echo "Fetch result       : ${{ steps.fetch.outputs.fetch_ok }}"  >> .github/keepalive/last_run.txt
            echo "API key configured : ${{ steps.check_key.outputs.key_set }}" >> .github/keepalive/last_run.txt
            echo "Note: data.gov.in blocks Azure/GitHub runner IPs. Use update_today_mandi_data.bat locally for live data." >> .github/keepalive/last_run.txt

            git add .github/keepalive/last_run.txt
            git commit -m "chore(keepalive): scheduled run $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
            echo "Keepalive commit written — cron schedule stays active."
          else
            ROWS=$(wc -l < data_engine/Dataset.csv)
            git commit -m "data: auto-update mandi dataset $(date -u '+%Y-%m-%d') — ${ROWS} total rows [skip ci]"
            echo "Dataset updated and committed with ${ROWS} total rows."
          fi

      # ── 7. Push to GitHub ─────────────────────────────────────────────────
      - name: Push to GitHub
        run: |
          git push origin HEAD:${{ github.ref_name }}
          echo "Push complete. Next scheduled run in ~12 hours."

      # ── 8. Summary Report ─────────────────────────────────────────────────
      - name: Job Summary
        run: |
          echo "## AgriMarket AI — Mandi Data Fetch Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Run Time (UTC) | $(date -u '+%Y-%m-%d %H:%M:%S') |" >> $GITHUB_STEP_SUMMARY
          echo "| API Key Set | ${{ steps.check_key.outputs.key_set }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Fetch Success | ${{ steps.fetch.outputs.fetch_ok }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dataset Rows | $(wc -l < data_engine/Dataset.csv) |" >> $GITHUB_STEP_SUMMARY
          echo "| Next Run | In ~12 hours |" >> $GITHUB_STEP_SUMMARY
