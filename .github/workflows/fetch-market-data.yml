name: Auto Fetch Mandi Market Data (Every 12 Hours)

on:
  schedule:
    # Runs at 00:00 and 12:00 UTC every day (every 12 hours)
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

concurrency:
  group: fetch-market-data
  cancel-in-progress: false

jobs:
  fetch-and-push:
    name: Fetch Mandi Data & Push to GitHub
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to commit and push changes back to the repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv

      - name: Run Mandi Fetch Script
        env:
          MARKET_DATA_API_KEY: ${{ secrets.MARKET_DATA_API_KEY }}
        run: |
          if [ -z "$MARKET_DATA_API_KEY" ]; then
            echo "::warning::MARKET_DATA_API_KEY secret is not set. Skipping data fetch."
            exit 0
          fi
          python data_engine/fetch_daily_market_data.py --max-records 5000 || echo "::warning::Data fetch failed or was geo-blocked. Dataset unchanged."

      - name: Commit and Push Updated Dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_engine/Dataset.csv
          if git diff --staged --quiet; then
            echo "No new market data found or dataset is unchanged. Skipping commit."
          else
            git commit -m "chore(data): auto-update mandi dataset (every 12h) [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
            echo "Dataset successfully updated and pushed to GitHub."
          fi

