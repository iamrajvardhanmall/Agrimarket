name: Auto Fetch Mandi Market Data (Every 12 Hours)

on:
  schedule:
    # Runs at 06:17 and 18:17 UTC every day (every 12 hours)
    # Off-beat minute avoids GitHub's peak-load queue congestion at :00 marks
    # 06:17 UTC = 11:47 IST  |  18:17 UTC = 23:47 IST
    - cron: '17 6,18 * * *'
  workflow_dispatch:   # Manual trigger from GitHub Actions tab anytime
    inputs:
      force_commit:
        description: 'Force a keepalive commit even if no new data (yes/no)'
        required: false
        default: 'no'

concurrency:
  group: fetch-market-data
  cancel-in-progress: false

jobs:
  fetch-and-push:
    name: Fetch Mandi Data & Push to GitHub
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python setup (no pip cache — no requirements.txt exists) ──────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Install only what the script needs ────────────────────────────
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install python-dotenv --quiet

      # ── 4. Try live data fetch (geo-block is expected; not a failure) ────
      - name: Run Mandi Fetch Script
        id: fetch
        env:
          MARKET_DATA_API_KEY: ${{ secrets.MARKET_DATA_API_KEY }}
        run: |
          if [ -z "$MARKET_DATA_API_KEY" ]; then
            echo "::warning::MARKET_DATA_API_KEY secret not set — skipping live fetch."
            echo "fetch_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Starting data fetch at $(date -u '+%Y-%m-%d %H:%M:%S UTC') ..."
          if python data_engine/fetch_daily_market_data.py --max-records 5000; then
            echo "fetch_ok=true" >> "$GITHUB_OUTPUT"
            echo "Live data fetched successfully."
          else
            echo "fetch_ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=data.gov.in Geo-Block::data.gov.in blocks foreign cloud runner IPs (Azure/GitHub). Dataset unchanged. This is expected — use update_today_mandi_data.bat locally to push live data."
          fi

      # ── 5. Commit data if changed, OR write keepalive stamp ──────────────
      #    This guarantees at least one commit every run so GitHub never
      #    disables the cron schedule due to 60-day inactivity.
      - name: Commit Dataset or Write Keepalive Stamp
        env:
          FORCE_COMMIT: ${{ github.event.inputs.force_commit || 'no' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data_engine/Dataset.csv

          if git diff --staged --quiet; then
            echo "No new market data (geo-blocked or unchanged)."
            # Write a keepalive stamp so the cron job always produces a commit
            # and GitHub never disables the schedule due to inactivity.
            mkdir -p .github/keepalive
            echo "Last scheduled run: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .github/keepalive/last_run.txt
            echo "Fetch result: ${{ steps.fetch.outputs.fetch_ok }}" >> .github/keepalive/last_run.txt
            echo "Note: data.gov.in blocks Azure/GitHub runner IPs. Use update_today_mandi_data.bat locally for live data." >> .github/keepalive/last_run.txt
            git add .github/keepalive/last_run.txt
            git commit -m "chore(keepalive): scheduled run $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
            echo "Keepalive commit written — cron schedule stays active."
          else
            git commit -m "auto-update mandi dataset $(date -u '+%Y-%m-%d') [skip ci]"
            echo "Dataset updated and committed."
          fi

      # ── 6. Push ──────────────────────────────────────────────────────────
      - name: Push to GitHub
        run: |
          git push origin HEAD:${{ github.ref_name }}
          echo "Push complete. Next scheduled run in ~12 hours."
